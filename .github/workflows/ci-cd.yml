name: CI/CD Operation Surabaya

on:
  push:
    branches:
      - main
      - "dev/**"
      - "dev-*"
  pull_request:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI - Lint, Syntax & Smoke Import
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff fastapi uvicorn python-socketio python-dotenv supabase livekit-api

      - name: Syntax check (compileall)
        run: python -m compileall -q app config routes main.py

      - name: Lint with Ruff (critical errors)
        run: ruff check --select E9,F63,F7,F82 app config routes main.py

      - name: Smoke test FastAPI app import
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          SUPABASE_ANON_KEY: dummy-anon-key
        run: |
          python -c "import main; assert main.app is not None; print('Smoke import OK')"

  build-and-deploy:
    name: CD - Build GHCR & Deploy to VPS
    needs: ci
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: meta
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: "${{ secrets.VPS_APP_DIR || '/opt/operation-surabaya' }}"

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/operation-surabaya' }}"
            cd "$APP_DIR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            IMAGE_NAME="${{ steps.meta.outputs.image }}:latest" docker compose pull
            IMAGE_NAME="${{ steps.meta.outputs.image }}:latest" docker compose up -d --remove-orphans
            docker image prune -f
